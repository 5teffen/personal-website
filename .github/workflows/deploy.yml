name: Build and deploy

# Pull requests only build, which runs the content schema and type checks, so a
# project page that breaks a consistency rule is caught before it can be merged.
# Pushes to main build and deploy to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # Astro 7 needs 22.12 or newer
          cache: npm
          cache-dependency-path: my-website/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build   # astro check, then astro build with schema validation

      - name: Copy CNAME into the build
        run: cp ../CNAME dist/CNAME

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
